# Replace coeer.example.com with your real domain.
# Install to: /etc/nginx/sites-available/coeer
# Enable with: sudo ln -s /etc/nginx/sites-available/coeer /etc/nginx/sites-enabled/coeer
# This template does not configure certificates. Enable HTTP/2 in the existing TLS
# server after checking nginx -V (listen 443 ssl http2 on older versions;
# listen 443 ssl + http2 on on Nginx >= 1.25.1).

upstream coeer_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name coeer.example.com;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # srvx 0.11.7 recompresses every file with Node's default Brotli quality (11).
    # Let Nginx gzip handle encoding instead, including already-compressed images.
    proxy_set_header Accept-Encoding "";

    # Vite content hashes change when content changes. The release controller keeps
    # prior assets for open tabs. Keep srvx here so private release permissions and
    # the existing atomic current-link activation/rollback continue to work.
    location /assets/ {
        proxy_pass http://coeer_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://coeer_backend;
    }
}
